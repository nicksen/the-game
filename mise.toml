[tools]
bun = "1.4.2"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.bundle]
description = "Bundle the game's modules into build/game.js, the one script index.html loads"
sources = ["js/*.js"]
outputs = ["build/game.js"]
run = "bun build js/main.js --format=iife --outfile build/game.js"

[tasks.watch]
description = "Rebuild build/game.js on every change, for playing from index.html while editing"
run = "bun build js/main.js --format=iife --outfile build/game.js --watch"

[tasks.start]
description = "Play the game through the launcher, without compiling it"
depends = ["bundle"]
run = "bun launcher/server.ts"

[tasks.build]
description = "Compile a self-contained executable for this computer into dist/"
depends = ["bundle"]
sources = ["launcher/*.ts", "index.html", "style.css", "build/game.js", "sw.js", "manifest.webmanifest", "icons/*.png"]
outputs = ["dist/smack-the-dummy"]
run = "bun build --compile --minify launcher/server.ts --outfile dist/smack-the-dummy"

[tasks."build:all"]
description = "Compile executables for macOS, Windows and Linux into dist/"
depends = ["bundle"]
run = [
  "bun build --compile --minify --target=bun-darwin-arm64 launcher/server.ts --outfile dist/smack-the-dummy-macos-arm64",
  "bun build --compile --minify --target=bun-darwin-x64 launcher/server.ts --outfile dist/smack-the-dummy-macos-x64",
  "bun build --compile --minify --target=bun-windows-x64 launcher/server.ts --outfile dist/smack-the-dummy-windows-x64.exe",
  "bun build --compile --minify --target=bun-linux-x64 launcher/server.ts --outfile dist/smack-the-dummy-linux-x64",
]

[tasks.site]
description = "Collect the game's files into _site/ for GitHub Pages"
depends = ["bundle"]
run = "bun tools/build-site.ts"

[tasks.lint]
description = "Check the code with oxlint"
depends = ["install"]
run = "bunx oxlint --deny-warnings"

[tasks.format]
description = "Format the code with prettier"
depends = ["install"]
run = "bunx prettier --write ."

[tasks."format:check"]
description = "Check the code is formatted with prettier"
depends = ["install"]
run = "bunx prettier --check ."

[tasks.typecheck]
description = "Check the TypeScript types"
depends = ["install"]
run = "bunx tsc --noEmit"

[tasks.test]
description = "Replay a scripted play session and compare it with the recorded baseline"
depends = ["install", "bundle"]
run = "bun tests/replay.mjs"

[tasks."test:exe"]
description = "Build the executable and replay the same session against it"
depends = ["install", "build"]
run = "bun tests/executable.mjs"

[tasks."test:pwa"]
description = "Check the installable app: Chrome's install criteria, offline caching, and playing offline"
depends = ["install", "bundle"]
run = "bun tests/pwa.mjs"

[tasks."test:update"]
description = "Re-record the replay baseline after an intended change"
depends = ["install", "bundle"]
run = "bun tests/replay.mjs --update"
