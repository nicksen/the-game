let props = [], heldProp = null;

function makeProp(spec) {
  const x = Math.max(spec.w / 2, Math.min(W - spec.w / 2, spec.x));
  return { ...spec, x, y: spec.y ?? floorY() - spec.h / 2, vx: spec.vx || 0, vy: spec.vy || 0,
    a: spec.a || 0, va: spec.va || 0, cd: 0, landCd: 0 };
}
function buildProps() { props = (PROPS[roomId] || (() => []))().map(makeProp); }

function propCorners(p) {
  const c = Math.cos(p.a), s = Math.sin(p.a);
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => ({
    x: p.x + sx * p.w / 2 * c - sy * p.h / 2 * s,
    y: p.y + sx * p.w / 2 * s + sy * p.h / 2 * c,
  }));
}
function inProp(p, x, y, pad = 0) {
  const c = Math.cos(-p.a), s = Math.sin(-p.a), dx = x - p.x, dy = y - p.y;
  const lx = dx * c - dy * s, ly = dx * s + dy * c;
  return Math.abs(lx) < p.w / 2 + pad && Math.abs(ly) < p.h / 2 + pad;
}

function stepProps(fy) {
  const { g: G } = phys(), space = G === 0;
  for (const p of props) {
    if (p.cd > 0) p.cd--;
    if (p.landCd > 0) p.landCd--;
    if (p === heldProp) {
      const tx = pointer.x + p.gx, ty = pointer.y + p.gy;
      p.vx = tx - p.x; p.vy = ty - p.y; p.x = tx; p.y = ty;
      p.a += (Math.max(-0.6, Math.min(0.6, pointer.vx * 0.03)) - p.a) * 0.15;
      p.va = 0;
    } else {
      p.vy += GRAVITY * G; p.vx *= 0.995;
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.va *= 0.99;
    }

    // Keep inside the room using the rotated corners
    const cs = propCorners(p);
    const maxY = Math.max(...cs.map(c => c.y)), minY = Math.min(...cs.map(c => c.y));
    const minX = Math.min(...cs.map(c => c.x)), maxX = Math.max(...cs.map(c => c.x));
    if (maxY > fy) {
      p.y -= maxY - fy;
      if (p !== heldProp) {
        if (p.vy > 8 && p.landCd === 0) {
          p.landCd = 10;
          if (p.soft) sfx.squeak(); else sfx.thud();
          shake = Math.max(shake, Math.min(15, p.vy * p.mass * 0.4));
          burst(p.x, fy - 5, 6, 'smoke', { speed: 2, life: 40, size: 10 });
        }
        if (space) {
          // Nothing holds it down, so it just bounces off the deck
          p.vy = -Math.abs(p.vy) * 0.7;
        } else {
          if (p.vy > 0) p.vy *= -0.25;
          p.vx *= 0.8; p.va *= 0.6;
          // Settle onto the nearest flat side
          const q = Math.round(p.a / (Math.PI / 2)) * (Math.PI / 2);
          p.a += (q - p.a) * 0.2;
        }
      }
    }
    const wb = space ? 0.7 : 0.4;
    if (minY < 0) { p.y -= minY; p.vy = Math.abs(p.vy) * (space ? 0.7 : 0.3); }
    if (minX < 0) { p.x -= minX; p.vx = Math.abs(p.vx) * wb; }
    if (maxX > W) { p.x -= maxX - W; p.vx = -Math.abs(p.vx) * wb; }

    // Smack the dummy
    const speed = Math.hypot(p.vx, p.vy);
    if (speed > 6 && p.cd === 0) {
      const hit = points.find(q => inProp(p, q.x, q.y, q.r));
      if (hit) {
        p.cd = 15;
        const k = Math.min(1.3, 0.5 + p.mass * 0.3), s = Math.min(1, 40 / speed);
        const reach = Math.max(p.w, p.h) / 2 + 60;
        for (const q of points) {
          if (Math.hypot(q.x - p.x, q.y - p.y) < reach) { q.px -= p.vx * s * k; q.py -= p.vy * s * k - 3; }
        }
        damage(hit, Math.min(120, speed * s * p.mass * 0.9 + 3), 'furniture');
        if (p.soft) sfx.squeak(); else { sfx.thud(); sfx.hit(1); }
        if (p !== heldProp) { p.vx *= -0.3; p.vy *= 0.3; p.va += rand(-0.1, 0.1); }
      }
    }
  }
}

function drawProp(p) {
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(p.a);
  p.draw(p.w, p.h);
  ctx.restore();
}
const propMoving = p => p === heldProp || Math.hypot(p.vx, p.vy) > 2;

// Render a room preview into a small canvas by temporarily redirecting the drawing globals
function renderThumb(room, cv) {
  const tw = 248, th = 160;
  cv.width = tw; cv.height = th;
  const saved = [ctx, W, H, roomId];
  ctx = cv.getContext('2d'); W = 1000; H = 1000 * th / tw; roomId = room.id;
  ctx.setTransform(tw / W, 0, 0, tw / W, 0, 0);
  drawRoom();
  for (const spec of PROPS[room.id]()) drawProp(makeProp(spec));
  [ctx, W, H, roomId] = saved;
}

function drawShadow(x, height, w) {
  const fy = floorY();
  const s = Math.max(0.3, 1 - height / 500);
  ctx.fillStyle = `rgba(0,0,0,${0.3 * s})`;
  ctx.beginPath(); ctx.ellipse(x, fy + 4, w * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill();
}

function chain(pts, w, col) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = OUT; ctx.lineWidth = w + 6; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function blob(p, r, col) {
  circle(p.x, p.y, r); ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
}
function joint(p) { circle(p.x, p.y, 3.5); ctx.fillStyle = OUT; ctx.fill(); }

const LOOKS = {
  dummy: { name: 'Crash Dummy', icon: '🟡', arm: YEL, leg: YEL, torso: YEL, hand: YEL, foot: YEL, head: YEL, armW: 16, legW: 18 },
  suit: { name: 'Suit Guy', icon: '👔', arm: [126, 84, 50], leg: [46, 50, 56], torso: [126, 84, 50],
          hand: [241, 199, 161], foot: [26, 26, 26], head: [241, 199, 161], armW: 13, legW: 15 },
};
let lookId = LOOKS[save.look] ? save.look : 'dummy';
const shadeRGB = c => c.map(v => v * 0.84);

function drawDummy() {
  const look = LOOKS[lookId], t = bodyFlash * 0.7;
  const c = (part, back = false) => mix(back ? shadeRGB(look[part]) : look[part], RED, t);
  const n = B.neck, pv = B.pelvis;
  const dx = pv.x - n.x, dy = pv.y - n.y, L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  const shoulder = side => ({ x: n.x + nx * 18 * side + ux * 6, y: n.y + ny * 18 * side + uy * 6 });
  const hip = side => ({ x: pv.x + nx * 10 * side, y: pv.y + ny * 10 * side });

  // Back limbs
  chain([shoulder(-1), B.rElbow, B.rHand], look.armW, c('arm', true)); joint(B.rElbow); blob(B.rHand, 11, c('hand', true));
  chain([hip(-1), B.rKnee, B.rFoot], look.legW, c('leg', true)); joint(B.rKnee); blob(B.rFoot, 12, c('foot', true));

  // Torso
  const top = { x: n.x - ux * 10, y: n.y - uy * 10 }, bot = { x: pv.x + ux * 12, y: pv.y + uy * 12 };
  const tw = lookId === 'suit' ? 23 : 26, bw = lookId === 'suit' ? 19 : 21;
  ctx.beginPath();
  ctx.moveTo(top.x + nx * tw, top.y + ny * tw);
  ctx.lineTo(bot.x + nx * bw, bot.y + ny * bw);
  ctx.lineTo(bot.x - nx * bw, bot.y - ny * bw);
  ctx.lineTo(top.x - nx * tw, top.y - ny * tw);
  ctx.closePath();
  ctx.lineJoin = 'round'; ctx.fillStyle = c('torso'); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 5; ctx.stroke();

  const at = (f, side = 0) => ({ x: n.x + dx * f + nx * side, y: n.y + dy * f + ny * side });
  if (lookId === 'suit') {
    // Shirt V, tie, lapels and a button
    const vl = at(-0.12, 11), vr = at(-0.12, -11), vb = at(0.5);
    ctx.beginPath(); ctx.moveTo(vl.x, vl.y); ctx.lineTo(vb.x, vb.y); ctx.lineTo(vr.x, vr.y); ctx.closePath();
    ctx.fillStyle = '#f7f7f7'; ctx.fill();
    const k1 = at(-0.08, 3), k2 = at(-0.08, -3), t1 = at(0.42, 4), t2 = at(0.42, -4), tp = at(0.5);
    ctx.beginPath(); ctx.moveTo(k1.x, k1.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(tp.x, tp.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(k2.x, k2.y); ctx.closePath();
    ctx.fillStyle = '#c0392b'; ctx.fill();
    ctx.strokeStyle = '#4a2f1a'; ctx.lineWidth = 3;
    seg(vl.x, vl.y, vb.x, vb.y); seg(vr.x, vr.y, vb.x, vb.y);
    const btn = at(0.68); circle(btn.x, btn.y, 2.5); ctx.fillStyle = '#4a2f1a'; ctx.fill();
  } else {
    // Belt and crash-test marker
    ctx.beginPath();
    ctx.moveTo(pv.x + nx * 20 - ux * 4, pv.y + ny * 20 - uy * 4);
    ctx.lineTo(pv.x - nx * 20 - ux * 4, pv.y - ny * 20 - uy * 4);
    ctx.lineWidth = 6; ctx.stroke();
    marker(n.x + dx * 0.4, n.y + dy * 0.4, 9);
  }

  // Front limbs
  chain([hip(1), B.lKnee, B.lFoot], look.legW, c('leg')); joint(B.lKnee); blob(B.lFoot, 12, c('foot'));
  chain([shoulder(1), B.lElbow, B.lHand], look.armW, c('arm')); joint(B.lElbow); blob(B.lHand, 11, c('hand'));

  drawHead(c('head'));
}

function drawHead(col) {
  const h = B.head, n = B.neck, r = h.r, suit = lookId === 'suit';
  const ang = Math.atan2(h.y - n.y, h.x - n.x) + Math.PI / 2;
  ctx.save();
  ctx.translate(h.x, h.y); ctx.rotate(ang);

  const HAIR = '#7a4a2a', HAIR_D = '#4a2c18';
  if (suit) {
    // Back of the hair, down to about ear level
    rr(-r - 4, -r - 4, r * 2 + 8, r + 12, 12);
    ctx.fillStyle = HAIR; ctx.fill(); ctx.strokeStyle = HAIR_D; ctx.lineWidth = 3; ctx.stroke();
  }

  circle(0, 0, r); ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = suit ? 3 : 5; ctx.stroke();
  if (!suit) marker(16, -15, 7);

  if (suit) {
    // Top of the hair with side-swept bangs
    ctx.beginPath();
    ctx.arc(0, 0, r + 3, Math.PI * 0.97, Math.PI * 2.03);
    ctx.lineTo(r - 4, 2);
    ctx.quadraticCurveTo(r - 2, -12, 10, -16);
    ctx.quadraticCurveTo(-4, -10, -14, -18);
    ctx.quadraticCurveTo(-r + 2, -10, -r + 3, 2);
    ctx.closePath();
    ctx.fillStyle = HAIR; ctx.fill(); ctx.strokeStyle = HAIR_D; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, -r + 2); ctx.quadraticCurveTo(4, -22, 14, -20); ctx.stroke();
  }

  // Band-aids pile up as the session goes on
  const aids = [[-14, -15, 0.6], [17, 9, -0.7], [-8, 15, 0.3], [4, -22, -0.2]];
  const count = Math.min(aids.length, Math.floor(sessionDmg / 250));
  for (let i = 0; i < count; i++) {
    const [x, y, r] = aids[i];
    for (const rot of [r, r + Math.PI / 2]) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      rr(-10, -3.5, 20, 7, 3); ctx.fillStyle = '#f2c9a0'; ctx.fill();
      ctx.strokeStyle = '#b5835a'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }
  }

  ctx.strokeStyle = OUT; ctx.fillStyle = OUT; ctx.lineCap = 'round';
  const dizzy = pain > 70, hurt = hurtT > 0;
  if (dizzy) {
    for (const ex of [-10, 10]) {
      ctx.beginPath();
      for (let t = 0; t < Math.PI * 4; t += 0.3) {
        const rad = t * 0.6, a = t + performance.now() / 150;
        ctx.lineTo(ex + Math.cos(a) * rad, -4 + Math.sin(a) * rad);
      }
      ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.beginPath(); ctx.lineWidth = 3;
    for (let x = -10; x <= 10; x += 2) ctx.lineTo(x, 13 + Math.sin(x * 0.8) * 2);
    ctx.stroke();
    rr(1, 13, 7, 9, 3.5); ctx.fillStyle = '#ff6b8a'; ctx.fill();
  } else if (hurt) {
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-15, -9); ctx.lineTo(-7, -4); ctx.lineTo(-15, 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -9); ctx.lineTo(7, -4); ctx.lineTo(15, 1); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 13, 8, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 17, 5, 3, 0, 0, Math.PI * 2); ctx.fillStyle = '#ff6b8a'; ctx.fill();
  } else {
    const yawning = idling && idle.action === 'stretch' && idle.t > 20 && idle.t < idle.dur - 20;
    if (yawning || blinkT > 0) {
      ctx.lineWidth = 3;
      for (const ex of [-10, 10]) { ctx.beginPath(); ctx.arc(ex, -6, 6, 0.2, Math.PI - 0.2); ctx.stroke(); }
    } else {
      // Eyes follow the pointer, or wander while idling
      let ox, oy;
      if (idling && idle.action === 'look') { ox = Math.sin(idle.t * 0.04) * 3; oy = 0; }
      else if (idling && idle.action === 'watch') { ox = -2; oy = 2.5; }
      else {
        const wx = pointer.x - h.x, wy = pointer.y - h.y;
        const lx = wx * Math.cos(-ang) - wy * Math.sin(-ang), ly = wx * Math.sin(-ang) + wy * Math.cos(-ang);
        const lm = Math.hypot(lx, ly) || 1;
        ox = lx / lm * 3; oy = ly / lm * 3;
      }
      for (const ex of [-10, 10]) {
        circle(ex, -4, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
        circle(ex + ox, -4 + oy, 3.2); ctx.fillStyle = OUT; ctx.fill();
      }
    }
    if (yawning) {
      ctx.beginPath(); ctx.ellipse(0, 12, 6, 9, 0, 0, Math.PI * 2); ctx.fillStyle = OUT; ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0, 8, 9, 0.2, Math.PI - 0.2); ctx.lineWidth = 3; ctx.stroke();
    }
  }
  ctx.restore();

  if (dizzy) {
    for (let i = 0; i < 3; i++) {
      const a = performance.now() / 300 + i * Math.PI * 2 / 3;
      star(h.x + Math.cos(a) * 36, h.y - 30 + Math.sin(a) * 8, 7, a);
      ctx.fillStyle = '#ffe14d'; ctx.fill(); ctx.strokeStyle = '#a07800'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
}

function drawBombs() {
  for (const b of bombs) {
    drawShadow(b.x, floorY() - b.y, 14);
    const blink = b.fuse < 40 && Math.floor(b.fuse / 4) % 2 === 0;
    circle(b.x, b.y, 14); ctx.fillStyle = blink ? '#c0392b' : '#222'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    circle(b.x - 5, b.y - 5, 4); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.x + 6, b.y - 11); ctx.quadraticCurveTo(b.x + 14, b.y - 22, b.x + 10, b.y - 26);
    ctx.strokeStyle = '#8b6b3d'; ctx.lineWidth = 3; ctx.stroke();
    star(b.x + 10, b.y - 27, rand(4, 7), Math.random() * 6); ctx.fillStyle = pick(['#ffd23f', '#ff7b00', '#fff']); ctx.fill();
  }
}

function drawProjectiles() {
  for (const pr of projectiles) {
    ctx.save();
    ctx.translate(pr.x, pr.y);
    if (pr.type === 'tomato') {
      ctx.rotate(pr.rot);
      circle(0, 0, pr.r); ctx.fillStyle = '#e8322a'; ctx.fill();
      ctx.strokeStyle = '#8a1510'; ctx.lineWidth = 2; ctx.stroke();
      star(0, -pr.r + 2, 6, 0); ctx.fillStyle = '#3c9a2e'; ctx.fill();
      circle(-3, -3, 3); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
    } else if (pr.type === 'rocket') {
      ctx.rotate(Math.atan2(pr.vy, pr.vx));
      ctx.fillStyle = '#c0392b';
      ctx.beginPath(); ctx.moveTo(-18, -6); ctx.lineTo(-26, -13); ctx.lineTo(-12, -6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, 6); ctx.lineTo(-26, 13); ctx.lineTo(-12, 6); ctx.fill();
      rr(-20, -6, 34, 12, 4); ctx.fillStyle = '#d9d9d9'; ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14, -6); ctx.lineTo(26, 0); ctx.lineTo(14, 6); ctx.closePath();
      ctx.fillStyle = '#c0392b'; ctx.fill(); ctx.stroke();
    } else if (pr.type === 'meteor') {
      ctx.rotate(pr.rot * 0.3);
      ctx.shadowColor = '#ff7b00'; ctx.shadowBlur = 30;
      circle(0, 0, pr.r); ctx.fillStyle = '#6b4a2b'; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ff9a3c'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#4a321c';
      for (const [cx, cy, cr] of [[-8, -6, 6], [9, 4, 5], [-2, 12, 4]]) { circle(cx, cy, cr); ctx.fill(); }
    }
    ctx.restore();

    if (pr.type === 'meteor') {
      // Landing target on the floor
      const fy = floorY();
      ctx.save();
      ctx.strokeStyle = `rgba(255,60,40,${0.5 + 0.5 * Math.sin(pr.age * 0.4)})`;
      ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.ellipse(pr.tx, fy + 4, 90, 14, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawCouches() {
  for (const c of couches) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, c.alpha);
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.strokeStyle = '#2b1240'; ctx.lineWidth = 3;
    ctx.fillStyle = '#5a3a1e';
    ctx.fillRect(-62, 18, 8, 9); ctx.fillRect(54, 18, 8, 9);
    rr(-66, -36, 132, 34, 10); ctx.fillStyle = '#6a2fa0'; ctx.fill(); ctx.stroke();
    rr(-66, -6, 132, 26, 6); ctx.fillStyle = '#8344c0'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, 16); ctx.lineWidth = 2; ctx.stroke();
    for (const ax of [-78, 56]) { rr(ax, -24, 22, 46, 9); ctx.fillStyle = '#7438ad'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke(); }
    ctx.restore();
  }
}

// Drawn facing right in local coordinates with the feet at y = 0, then mirrored for left-runners
function drawViking(v) {
  const fy = floorY(), s = v.scale, run = v.phase;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(v.x, fy + v.depth + 2, 22 * s, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(v.x, fy + v.depth - Math.abs(Math.sin(run)) * 4);
  ctx.scale(v.dir * s, s);

  // Legs pumping, back leg darker
  const leg = (a, col) => {
    const foot = { x: Math.sin(a) * 20, y: -4 - Math.max(0, Math.cos(a)) * 8 };
    const knee = { x: Math.sin(a) * 10 + 6, y: -24 };
    chain([{ x: 0, y: -42 }, knee, foot], 8, col);
    circle(foot.x + 3, foot.y, 6); ctx.fillStyle = '#4a2c18'; ctx.fill();
  };
  leg(run + Math.PI, '#4b3b2b'); leg(run, '#6b5440');

  // Round shield on the back arm
  circle(-12, -60, 17); ctx.fillStyle = v.shield; ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 4; seg(-12, -76, -12, -44);
  circle(-12, -60, 4); ctx.fillStyle = '#aaa'; ctx.fill();

  // Tunic and belt
  rr(-14, -82, 28, 44, 8); ctx.fillStyle = v.tunic; ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
  box(-14, -48, 28, 5, '#4a2c18', null);

  // Head, beard and horned helmet
  circle(3, -95, 13); ctx.fillStyle = '#f1c7a1'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5, -92); ctx.lineTo(16, -91); ctx.lineTo(10, -70); ctx.lineTo(0, -78); ctx.closePath();
  ctx.fillStyle = v.beard; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
  circle(10, -98, 2); ctx.fillStyle = OUT; ctx.fill();
  const horn = (bx, flip) => {
    ctx.beginPath(); ctx.moveTo(bx - 3, -102);
    ctx.quadraticCurveTo(bx + flip * 14, -108, bx + flip * 12, -126);
    ctx.quadraticCurveTo(bx + flip * 5, -110, bx + 3, -102); ctx.closePath();
    ctx.fillStyle = '#f3e6c4'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
  };
  horn(-8, -1); horn(14, 1);
  ctx.beginPath(); ctx.arc(3, -98, 14, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = '#9aa3ad'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
  box(14, -100, 4, 12, '#9aa3ad', OUT, 1.5);

  // Weapon arm: held overhead while charging, chops forward on a hit
  const sh = { x: 4, y: -74 }, ang = -1.9 + v.swing * 2.2;
  const hand = { x: sh.x + Math.cos(ang) * 24, y: sh.y + Math.sin(ang) * 24 };
  chain([sh, hand], 7, v.tunic);
  ctx.save(); ctx.translate(hand.x, hand.y); ctx.rotate(ang);
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  if (v.weapon === 'axe') {
    box(-4, -2.5, 40, 5, '#7a4f2a', null);
    ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(36, -13); ctx.quadraticCurveTo(46, 0, 36, 13); ctx.closePath();
    ctx.fillStyle = '#c9d1d9'; ctx.fill(); ctx.stroke();
  } else if (v.weapon === 'sword') {
    box(-4, -2.5, 8, 5, '#7a4f2a', null);
    box(4, -7, 4, 14, '#c9a227', null);
    ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(42, -3); ctx.lineTo(48, 0); ctx.lineTo(42, 3); ctx.lineTo(8, 3); ctx.closePath();
    ctx.fillStyle = '#dfe6ec'; ctx.fill(); ctx.stroke();
  } else {
    box(-16, -2, 66, 4, '#7a4f2a', null);
    ctx.beginPath(); ctx.moveTo(50, -6); ctx.lineTo(64, 0); ctx.lineTo(50, 6); ctx.closePath();
    ctx.fillStyle = '#c9d1d9'; ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  circle(hand.x, hand.y, 5); ctx.fillStyle = '#f1c7a1'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();

  ctx.restore();
}
function drawVikings() {
  for (const v of [...vikings].sort((a, b) => a.depth - b.depth)) drawViking(v);
}

function drawBolt() {
  if (zapT <= 0 || !zapTarget) return;
  const tx = zapTarget.x, ty = zapTarget.y;
  ctx.save();
  ctx.shadowColor = '#8fd8ff'; ctx.shadowBlur = 20;
  ctx.lineJoin = 'round';
  for (const [w, col] of [[7, 'rgba(140,210,255,0.6)'], [3, '#fff']]) {
    ctx.beginPath();
    let x = tx + rand(-80, 80), y = -10;
    ctx.moveTo(x, y);
    const segs = 10;
    for (let i = 1; i <= segs; i++) {
      const t = i / segs;
      x = x + (tx - x) * (1 / (segs - i + 1)) + (i < segs ? rand(-25, 25) : 0);
      y = -10 + (ty + 10) * t;
      ctx.lineTo(i === segs ? tx : x, y);
    }
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  }
  ctx.restore();
}

// Cartoon x-ray flash while being electrocuted
function drawSkeleton() {
  const bones = [[B.neck, B.pelvis], [B.neck, B.lElbow, B.lHand], [B.neck, B.rElbow, B.rHand],
                 [B.pelvis, B.lKnee, B.lFoot], [B.pelvis, B.rKnee, B.rFoot]];
  for (const b of bones) chain(b, 22, '#222');
  circle(B.head.x, B.head.y, B.head.r); ctx.fillStyle = '#222'; ctx.fill();
  for (const b of bones) {
    ctx.beginPath(); ctx.moveTo(b[0].x, b[0].y);
    for (let i = 1; i < b.length; i++) ctx.lineTo(b[i].x, b[i].y);
    ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  }
  const pv = B.pelvis, n = B.neck;
  for (let i = 1; i <= 3; i++) {
    const x = n.x + (pv.x - n.x) * i / 4, y = n.y + (pv.y - n.y) * i / 4;
    ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x + 14, y); ctx.lineWidth = 4; ctx.stroke();
  }
  circle(B.head.x, B.head.y, 18); ctx.fillStyle = '#f4f4f4'; ctx.fill();
  ctx.fillStyle = '#222';
  circle(B.head.x - 7, B.head.y - 3, 5); ctx.fill();
  circle(B.head.x + 7, B.head.y - 3, 5); ctx.fill();
  ctx.fillRect(B.head.x - 6, B.head.y + 8, 12, 3);
}

function drawPianos() {
  for (const pn of pianos) {
    if (!pn.landed) {
      const warn = Math.max(0, Math.min(1, (pn.y + 300) / (floorY() + 300)));
      ctx.fillStyle = `rgba(0,0,0,${0.15 + warn * 0.25})`;
      ctx.beginPath(); ctx.ellipse(pn.x, floorY() + 4, pn.w / 2 * (0.4 + warn * 0.6), 10, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    ctx.globalAlpha = Math.max(0, pn.alpha);
    const x = pn.x - pn.w / 2, y = pn.y - pn.h / 2;
    ctx.fillStyle = '#111'; ctx.fillRect(x + 12, y + pn.h - 12, 10, 12); ctx.fillRect(x + pn.w - 22, y + pn.h - 12, 10, 12);
    rr(x, y, pn.w, pn.h - 10, 8); ctx.fillStyle = '#1a1a1a'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x + 8, y + 6, pn.w - 16, 8);
    const ky = y + pn.h * 0.5, kh = 22;
    ctx.fillStyle = '#f5f5f0'; ctx.fillRect(x + 6, ky, pn.w - 12, kh);
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
    const keys = 14, kw = (pn.w - 12) / keys;
    for (let i = 1; i < keys; i++) { ctx.beginPath(); ctx.moveTo(x + 6 + i * kw, ky); ctx.lineTo(x + 6 + i * kw, ky + kh); ctx.stroke(); }
    ctx.fillStyle = '#111';
    for (let i = 0; i < keys - 1; i++) if (i % 7 !== 2 && i % 7 !== 6) ctx.fillRect(x + 6 + (i + 1) * kw - kw * 0.3, ky, kw * 0.6, kh * 0.6);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, 1 - p.life / p.max);
    ctx.globalAlpha = a;
    switch (p.type) {
      case 'star':
        star(p.x, p.y, p.size, p.rot); ctx.fillStyle = '#ffe14d'; ctx.fill();
        ctx.strokeStyle = '#a07800'; ctx.lineWidth = 1.5; ctx.stroke(); break;
      case 'feather':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.35, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1; ctx.stroke();
        ctx.restore(); break;
      case 'smoke':
        ctx.globalAlpha = a * 0.45; circle(p.x, p.y, p.size); ctx.fillStyle = '#777'; ctx.fill(); break;
      case 'fire': {
        const t = p.life / p.max;
        circle(p.x, p.y, p.size * (1 - t * 0.5));
        ctx.fillStyle = mix([255, 230, 80], [220, 40, 20], t); ctx.fill(); break;
      }
      case 'debris':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
        ctx.restore(); break;
      case 'drop':
        circle(p.x, p.y, p.size); ctx.fillStyle = p.color; ctx.fill(); break;
      case 'wind':
        ctx.globalAlpha = a * 0.5; ctx.strokeStyle = '#dff4ff'; ctx.lineWidth = 2;
        seg(p.x, p.y, p.x - p.vx * 4, p.y - p.vy * 4); break;
    }
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const t of texts) {
    const pop = t.life < 6 ? 0.6 + t.life / 6 * 0.6 : 1.2 - Math.min(0.2, (t.life - 6) / 30);
    ctx.save();
    ctx.globalAlpha = Math.min(1, (t.max - t.life) / 15);
    ctx.translate(t.x, t.y); ctx.rotate(t.rot); ctx.scale(pop, pop);
    ctx.font = `900 ${t.size}px Impact, "Arial Black", sans-serif`;
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(3, t.size / 7); ctx.strokeText(t.text, 0, 0);
    ctx.fillStyle = t.color; ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
}

function drawSpeech() {
  if (!speech) return;
  const s = speech;
  ctx.save();
  ctx.globalAlpha = s.t < 8 ? s.t / 8 : s.t > 100 ? (120 - s.t) / 20 : 1;
  ctx.font = 'bold 17px "Trebuchet MS", sans-serif';
  const bw = ctx.measureText(s.text).width + 24, bh = 34;
  const hx = B.head.x, hy = B.head.y - B.head.r - 14;
  const bx = Math.max(8, Math.min(W - bw - 8, hx - bw / 2));
  const by = Math.max(8, hy - bh - 22);
  const tx = Math.max(bx + 14, Math.min(bx + bw - 14, hx));
  ctx.beginPath();
  ctx.moveTo(tx - 8, by + bh - 1); ctx.lineTo(hx, Math.max(by + bh + 4, hy)); ctx.lineTo(tx + 8, by + bh - 1);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
  rr(bx, by, bw, bh, 12); ctx.fill(); ctx.stroke();
  ctx.fillRect(tx - 6, by + bh - 4, 12, 4);
  ctx.fillStyle = OUT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s.text, bx + bw / 2, by + bh / 2 + 1);
  ctx.restore();
}

function drawCursor() {
  if (!pointer.inside || tool === 'grab') return;
  const t = TOOLS.find(t => t.id === tool);
  ctx.save();
  ctx.translate(pointer.x, pointer.y);
  ctx.rotate(-swingT * 0.9);
  ctx.scale(1 + swingT * 0.3, 1 + swingT * 0.3);
  ctx.font = '44px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t.icon, 0, 0);
  ctx.restore();
}

function render() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  drawRoom();
  for (const p of props) if (!propMoving(p)) drawProp(p);
  drawShadow(B.pelvis.x, floorY() - B.pelvis.y, 50);
  drawBombs();
  if (zapT > 0 && !zapTarget.fake && (zapT >> 2) % 2) drawSkeleton();
  else drawDummy();
  drawVikings();
  for (const p of props) if (propMoving(p)) drawProp(p);
  drawProjectiles();
  drawCouches();
  drawPianos();
  drawBolt();
  drawParticles();
  drawTexts();
  drawSpeech();
  drawCursor();
  ctx.restore();
  if (flash > 0.01) { ctx.fillStyle = `rgba(255,240,200,${flash})`; ctx.fillRect(0, 0, W, H); }
  if (airlock.t >= 0) {
    ctx.fillStyle = `rgba(255,30,30,${0.07 + 0.06 * Math.sin(airlock.t * 0.3)})`; ctx.fillRect(0, 0, W, H);
  }

  const comboEl = document.getElementById('combo');
  const showCombo = combo >= 3 && performance.now() - lastHit < 1300;
  comboEl.style.opacity = showCombo ? 1 : 0;
  if (showCombo) comboEl.textContent = `x${combo} COMBO!`;
}

// ---------- UI ----------
const coinsEl = document.getElementById('coins');
const toastEl = document.getElementById('toast');
const bar = document.getElementById('toolbar');
let toastTimer = 0;

function updateHud() { coinsEl.textContent = '🪙 ' + save.coins; }
function toast(msg) {
  toastEl.textContent = msg; toastEl.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.opacity = 0, 1400);
}

function renderTools() {
  bar.innerHTML = '';
  TOOLS.forEach(t => {
    const locked = !save.unlocked.includes(t.id);
    const b = document.createElement('button');
    b.className = 'tool' + (t.id === tool ? ' active' : '') + (locked ? ' locked' : '') + (offHere(t) ? ' off' : '');
    b.innerHTML = `<span>${t.icon}</span><small>${locked ? '🪙 ' + t.price : t.name}</small>`;
    b.title = `${t.name} (${t.key.toUpperCase()})`;
    b.onclick = () => selectTool(t, b);
    bar.appendChild(b);
  });
}

// Some tools make no sense without gravity
const offHere = t => t.earthOnly && zeroG();

function selectTool(t, el) {
  ac();
  if (offHere(t)) {
    toast(`No ${t.icon} ${t.name} in the ${currentRoom().name}!`);
    if (el) { el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }
    return;
  }
  if (!save.unlocked.includes(t.id)) {
    if (save.coins >= t.price) {
      save.coins -= t.price; save.unlocked.push(t.id); persist(); updateHud();
      sfx.coin(); toast(`Unlocked ${t.icon} ${t.name}!`);
    } else {
      toast(`Need ${t.price - save.coins} more 🪙 for the ${t.name}`);
      if (el) { el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }
      return;
    }
  }
  tool = t.id;
  canvas.style.cursor = tool === 'grab' ? 'grab' : 'none';
  renderTools();
}

canvas.addEventListener('pointerdown', e => {
  ac();
  pointer.x = pointer.lastX = e.clientX; pointer.y = pointer.lastY = e.clientY;
  pointer.inside = true;
  canvas.setPointerCapture(e.pointerId);
  useTool();
});
canvas.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true; });
canvas.addEventListener('pointerleave', () => { if (!drag) pointer.inside = false; });
window.addEventListener('pointerup', () => {
  if (drag) {
    drag.px = drag.x - pointer.vx; drag.py = drag.y - pointer.vy;
    drag = null;
    canvas.style.cursor = tool === 'grab' ? 'grab' : 'none';
  }
  if (heldProp) {
    // Heavier furniture flies a little slower
    const k = 1.25 - 0.15 * heldProp.mass, clamp = v => Math.max(-40, Math.min(40, v * k));
    heldProp.vx = clamp(pointer.vx); heldProp.vy = clamp(pointer.vy);
    heldProp.va = pointer.vx * 0.012 / heldProp.mass;
    heldProp = null;
    canvas.style.cursor = tool === 'grab' ? 'grab' : 'none';
  }
});
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'a') { ac(); openAirlock(); return; }
  const t = TOOLS.find(t => t.key === e.key.toLowerCase());
  if (t) selectTool(t, bar.children[TOOLS.indexOf(t)]);
});
window.addEventListener('resize', resize);

document.getElementById('mute').onclick = e => {
  muted = !muted;
  e.currentTarget.textContent = muted ? '🔇' : '🔊';
};
function resetScene() {
  buildDummy(); buildProps(); heldProp = null; pain = 0; sessionDmg = 0; hurtT = 0; drag = null;
  bombs.length = 0; pianos.length = 0; projectiles.length = 0; couches.length = 0; vikings.length = 0; zapT = 0;
  airlock.t = -1; airlock.cooldown = 0; updateAirlockBtn();
}
document.getElementById('heal').onclick = () => { resetScene(); say(LINES.heal, true); };

const menuEl = document.getElementById('menu');
function renderLooks() {
  const list = document.getElementById('looks');
  list.innerHTML = '';
  for (const [id, look] of Object.entries(LOOKS)) {
    const b = document.createElement('button');
    b.className = 'look' + (id === lookId ? ' current' : '');
    b.innerHTML = `<span>${look.icon}</span>${look.name}`;
    b.onclick = () => { lookId = save.look = id; persist(); renderLooks(); };
    list.appendChild(b);
  }
}
function openMenu() {
  renderLooks();
  const list = document.getElementById('rooms');
  list.innerHTML = '';
  for (const room of ROOMS) {
    const b = document.createElement('button');
    b.className = 'room' + (room.id === roomId ? ' current' : '');
    const cv = document.createElement('canvas');
    renderThumb(room, cv);
    const label = document.createElement('div');
    label.textContent = room.name;
    b.append(cv, label);
    b.onclick = () => chooseRoom(room.id);
    list.appendChild(b);
  }
  menuEl.classList.remove('hidden');
}
function chooseRoom(id) {
  ac();
  roomId = save.room = id; persist();
  menuEl.classList.add('hidden');
  resetScene();
  if (offHere(TOOLS.find(t => t.id === tool))) tool = 'punch';
  renderTools();
  say([`Ooh, the ${currentRoom().name.toLowerCase()}! Please be gentle.`], true);
}
document.getElementById('roomBtn').onclick = openMenu;
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !menuEl.classList.contains('hidden')) menuEl.classList.add('hidden'); });

// ---------- Boot ----------
resize();
buildDummy();
buildProps();
updateHud();
updateAirlockBtn();
renderTools();
canvas.style.cursor = 'none';
openMenu();

let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
