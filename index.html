<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Smack the Dummy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="coins">🪙 0</div>
  <div id="combo"></div>
  <div id="buttons">
    <button class="btn" id="mute" title="Toggle sound">🔊</button>
    <button class="btn" id="heal" title="Heal the dummy">❤️</button>
    <button class="btn" id="airlockBtn" title="Open the airlock (A)">🚪</button>
    <button class="btn" id="roomBtn" title="Change room">🏠</button>
  </div>
</div>
<div id="toast"></div>
<div id="toolbar"></div>
<div id="menu">
  <div class="panel">
    <h1>Smack the Dummy</h1>
    <p>Pick a look</p>
    <div id="looks"></div>
    <p>Pick a room to start in</p>
    <div id="rooms"></div>
  </div>
</div>

<script src="js/canvas.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/physics.js"></script>
<script src="js/state.js"></script>
<script src="js/effects.js"></script>
<script src="js/dummy.js"></script>
<script src="js/dummy-art.js"></script>
<script src="js/room-art.js"></script>
<script src="js/rooms.js"></script>
<script src="js/furniture-art.js"></script>
<script src="js/furniture.js"></script>
<script src="js/tools.js"></script>
<script src="js/hazards.js"></script>
<script src="js/vikings.js"></script>
<script src="js/airlock.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
