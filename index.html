<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Smack the Dummy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #1b1b2f;
    font-family: "Trebuchet MS", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    color: #fff; font-weight: bold; text-shadow: 0 2px 0 #000; pointer-events: none;
  }
  #coins { font-size: 26px; }
  #combo { font-size: 22px; color: #ffd23f; opacity: 0; transition: opacity .15s; text-align: center; }
  #buttons { display: flex; gap: 8px; pointer-events: auto; }
  .btn {
    width: 44px; height: 44px; border-radius: 12px; border: 3px solid #444;
    background: #2a2a40; color: #fff; font-size: 20px; cursor: pointer;
  }
  .btn:hover { border-color: #888; }
  .btn:disabled { opacity: .4; cursor: default; border-color: #444; }
  #toolbar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; background: rgba(0,0,0,.5); padding: 8px; border-radius: 18px;
    max-width: calc(100vw - 16px); overflow-x: auto;
  }
  .tool {
    flex: none; width: 62px; height: 66px; border-radius: 12px; border: 3px solid #444;
    background: #2a2a40; color: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .tool span { font-size: 28px; line-height: 1; }
  .tool small { font-size: 11px; font-weight: bold; }
  .tool:hover { border-color: #888; }
  .tool.active { border-color: #ffd23f; background: #45456b; }
  .tool.locked span { filter: grayscale(1) brightness(.6); }
  .tool.locked small { color: #ffd23f; }
  .tool.off { opacity: .35; }
  .tool.nope { animation: nope .3s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.75); color: #fff; padding: 8px 16px; border-radius: 10px;
    font-weight: bold; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #menu {
    position: fixed; inset: 0; z-index: 10; background: rgba(10,10,25,.72);
    display: flex; align-items: center; justify-content: center;
  }
  #menu.hidden { display: none; }
  .panel {
    background: #25253d; border: 3px solid #444; border-radius: 20px; padding: 24px 28px;
    text-align: center; color: #fff; max-width: 94vw; max-height: 92vh; overflow-y: auto;
  }
  .panel h1 { font-family: Impact, "Arial Black", sans-serif; font-size: 44px; color: #ffd23f; text-shadow: 0 3px 0 #000; }
  .panel p { margin: 6px 0 18px; color: #ccc; }
  #looks { display: flex; gap: 12px; justify-content: center; margin-bottom: 8px; }
  .look {
    width: 130px; padding: 10px; border-radius: 14px; border: 3px solid #444; background: #2a2a40;
    color: #fff; cursor: pointer; font: inherit; font-weight: bold;
  }
  .look span { display: block; font-size: 30px; margin-bottom: 4px; }
  .look:hover, .look.current { border-color: #ffd23f; }
  #rooms { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .room {
    width: 130px; border-radius: 14px; border: 3px solid #444; background: #2a2a40; color: #fff;
    cursor: pointer; overflow: hidden; padding: 0; font: inherit; transition: transform .1s;
  }
  .room:hover { border-color: #ffd23f; transform: translateY(-3px); }
  .room.current { border-color: #ffd23f; }
  .room canvas { display: block; width: 124px; height: 80px; }
  .room div { padding: 8px; font-weight: bold; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="coins">🪙 0</div>
  <div id="combo"></div>
  <div id="buttons">
    <button class="btn" id="mute" title="Toggle sound">🔊</button>
    <button class="btn" id="heal" title="Heal the dummy">❤️</button>
    <button class="btn" id="airlockBtn" title="Open the airlock (A)">🚪</button>
    <button class="btn" id="roomBtn" title="Change room">🏠</button>
  </div>
</div>
<div id="toast"></div>
<div id="toolbar"></div>
<div id="menu">
  <div class="panel">
    <h1>Smack the Dummy</h1>
    <p>Pick a look</p>
    <div id="looks"></div>
    <p>Pick a room to start in</p>
    <div id="rooms"></div>
  </div>
</div>

<script>
'use strict';

// ---------- Setup ----------
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const floorY = () => H - 110;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- Save data ----------
const SAVE_KEY = 'smack-the-dummy-v1';
const save = { coins: 0, unlocked: ['grab', 'punch', 'chicken'], total: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- Audio (synthesized, no assets) ----------
let AC = null, noiseBuf = null, muted = false, lastHitSound = 0;
function ac() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function envelope(g, t, peak, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function noise(dur, type, freq, peak, freqEnd) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime;
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = a.createGain(); envelope(g, t, peak, dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t); src.stop(t + dur + 0.05);
}
function tone(type, f0, f1, dur, peak, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = a.createGain(); envelope(g, t, peak, dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  hit(i) {
    const now = performance.now();
    if (now - lastHitSound < 45) return;
    lastHitSound = now;
    i = Math.min(1, i);
    tone('sine', rand(160, 240), 45, 0.18, 0.15 + 0.45 * i);
    noise(0.08, 'lowpass', 1500 + i * 1500, 0.05 + 0.3 * i);
  },
  bonk() { tone('triangle', 650, 180, 0.15, 0.35); },
  swoosh() { noise(0.18, 'bandpass', 500, 0.12, 2500); },
  squeak() {
    const f = rand(700, 1000);
    tone('square', f, f * 1.8, 0.12, 0.07);
    tone('square', f * 1.8, f * 0.9, 0.15, 0.06, 0.12);
  },
  boom() { noise(1.2, 'lowpass', 900, 0.9, 60); tone('sine', 90, 25, 0.8, 0.8); },
  piano() {
    const notes = [130.8, 155.6, 185, 207.7, 261.6, 311.1, 370, 415.3, 523.3];
    for (let i = 0; i < 6; i++) tone('triangle', pick(notes), null, 1.4, 0.12, Math.random() * 0.04);
    noise(0.3, 'lowpass', 2000, 0.5);
    tone('sine', 70, 30, 0.5, 0.6);
  },
  slap() { noise(0.07, 'highpass', 900, 0.5); tone('sine', 320, 110, 0.12, 0.3); },
  splat() { noise(0.15, 'lowpass', 700, 0.5, 200); tone('sine', 140, 60, 0.12, 0.3); },
  clang() { tone('square', 520, 470, 0.35, 0.08); tone('square', 790, 760, 0.3, 0.05); sfx.hit(1); },
  zap() { tone('sawtooth', 90, 60, 0.8, 0.15); noise(0.8, 'bandpass', 3000, 0.12, 1500); },
  rocket() { noise(0.9, 'bandpass', 400, 0.25, 1600); },
  meteor() { noise(1.6, 'lowpass', 300, 0.3, 1200); tone('sine', 200, 60, 1.6, 0.2); },
  thud() { tone('sine', 110, 35, 0.4, 0.7); noise(0.3, 'lowpass', 600, 0.5, 150); },
  coin() { tone('square', 988, null, 0.08, 0.05); tone('square', 1319, null, 0.25, 0.05, 0.08); },
  tick() { tone('square', 1800, null, 0.03, 0.03); },
  alarm() { tone('square', 880, 620, 0.22, 0.06); },
  warcry() {
    for (let i = 0; i < 6; i++) tone('sawtooth', rand(150, 240), rand(90, 120), 0.9, 0.04, i * 0.04);
    noise(1, 'lowpass', 500, 0.25, 150);
  },
  stomp() { tone('sine', rand(70, 90), 40, 0.07, 0.12); },
  whoosh() { noise(3.4, 'bandpass', 250, 0.4, 1400); },
};

// ---------- Dummy (verlet ragdoll) ----------
const GRAVITY = 0.6, DAMP = 0.99, BOUNCE = 0.4, FRICTION = 0.85, MAXV = 50, ITER = 8;
// Rooms flagged zeroG switch gravity off and make everything drift longer and bounce harder
const PHYS = {
  earth: { g: 1, damp: DAMP, bounce: BOUNCE, friction: FRICTION },
  space: { g: 0, damp: 0.998, bounce: 0.75, friction: 0.97 },
};
const zeroG = () => !!currentRoom().zeroG;
const phys = () => zeroG() ? PHYS.space : PHYS.earth;
let points = [], sticks = [];
const B = {};

function buildDummy() {
  points = []; sticks = [];
  // In zero-g the dummy starts floating mid-room with a lazy drift
  const float = zeroG(), cx = W / 2, fy = floorY() - (float ? 160 : 0);
  const mk = (name, dx, dy, r) => {
    const p = { x: cx + dx, y: fy + dy, px: cx + dx + (float ? 0.5 : 0), py: fy + dy - (float ? 0.2 : 0), r, cd: 0 };
    points.push(p); B[name] = p;
  };
  mk('head', 0, -185, 28); mk('neck', 0, -145, 16); mk('pelvis', 0, -80, 18);
  mk('lElbow', -32, -115, 9); mk('lHand', -42, -82, 11);
  mk('rElbow', 32, -115, 9); mk('rHand', 42, -82, 11);
  mk('lKnee', -14, -42, 10); mk('lFoot', -16, -11, 11);
  mk('rKnee', 14, -42, 10); mk('rFoot', 16, -11, 11);

  // minRatio: only push apart when closer than len * minRatio (keeps limbs from folding flat)
  const s = (a, b, stiff = 1, minRatio = 0) => {
    const len = Math.hypot(B[a].x - B[b].x, B[a].y - B[b].y);
    sticks.push({ a: B[a], b: B[b], len: minRatio ? len * minRatio : len, stiff, min: !!minRatio });
  };
  s('head', 'neck'); s('neck', 'pelvis'); s('head', 'pelvis', 0.6);
  s('neck', 'lElbow'); s('lElbow', 'lHand'); s('neck', 'rElbow'); s('rElbow', 'rHand');
  s('pelvis', 'lKnee'); s('lKnee', 'lFoot'); s('pelvis', 'rKnee'); s('rKnee', 'rFoot');
  s('neck', 'lHand', 0.3, 0.6); s('neck', 'rHand', 0.3, 0.6);
  s('pelvis', 'lFoot', 0.3, 0.6); s('pelvis', 'rFoot', 0.3, 0.6);
  s('lKnee', 'rKnee', 0.2, 0.8);
}

// Clamp inside the room; with bounce=true also reflect velocity and report impact speed.
function collideBounds(p, bounce) {
  const fy = floorY(), { bounce: BNC, friction } = phys();
  let impact = 0;
  if (p.y > fy - p.r) {
    const vy = p.y - p.py, vx = p.x - p.px;
    p.y = fy - p.r;
    if (bounce) { p.py = p.y + vy * BNC; p.px = p.x - vx * friction; impact = Math.max(impact, vy); }
  }
  if (p.y < p.r) {
    const vy = p.y - p.py;
    p.y = p.r;
    if (bounce) { p.py = p.y + vy * BNC; impact = Math.max(impact, -vy); }
  }
  if (p.x < p.r) {
    const vx = p.x - p.px;
    p.x = p.r;
    if (bounce) { p.px = p.x + vx * BNC; impact = Math.max(impact, -vx); }
  }
  if (p.x > W - p.r) {
    const vx = p.x - p.px;
    p.x = W - p.r;
    if (bounce) { p.px = p.x + vx * BNC; impact = Math.max(impact, vx); }
  }
  return impact;
}

function solveStick(s) {
  const { a, b } = s;
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy) || 0.0001;
  if (s.min && d >= s.len) return;
  const wa = a === drag ? 0 : 1, wb = b === drag ? 0 : 1;
  if (wa + wb === 0) return;
  const diff = (d - s.len) / d * s.stiff / (wa + wb);
  a.x += dx * diff * wa; a.y += dy * diff * wa;
  b.x -= dx * diff * wb; b.y -= dy * diff * wb;
}

// Little routines the dummy plays when left alone.
const IDLE_ACTIONS = ['breathe', 'wave', 'stretch', 'tap', 'look', 'watch'];
function stepIdle(fy) {
  if (++idle.t > idle.dur) {
    // No foot tapping when there's no floor under your feet
    idle.action = pick(IDLE_ACTIONS.filter(a => a !== idle.action && !(a === 'tap' && zeroG())));
    idle.t = 0;
    idle.dur = idle.action === 'breathe' ? rand(180, 300) : rand(150, 220);
    const lines = { wave: LINES.wave, watch: LINES.watch, stretch: LINES.stretch }[idle.action];
    if (lines && Math.random() < 0.5) say(lines);
  }
  const t = idle.t, n = B.neck, pv = B.pelvis;
  const e = Math.min(1, t / 20, (idle.dur - t) / 20); // ease in and out
  const k = 0.1 * e;

  // Relaxed arms and a gentle breathing sway
  pull(B.lHand, n.x - 28, n.y + 65, 0.03);
  pull(B.rHand, n.x + 28, n.y + 65, 0.03);
  pull(B.head, pv.x + Math.sin(t * 0.015) * 3, pv.y - 105 + Math.sin(t * 0.05) * 2, 0.05);

  switch (idle.action) {
    case 'wave':
      pull(B.lElbow, n.x - 40, n.y - 5, k);
      pull(B.lHand, n.x - 45 + Math.sin(t * 0.3) * 15, n.y - 50, k);
      break;
    case 'stretch':
      pull(B.lElbow, n.x - 30, n.y - 35, k); pull(B.lHand, n.x - 20, n.y - 75, k);
      pull(B.rElbow, n.x + 30, n.y - 35, k); pull(B.rHand, n.x + 20, n.y - 75, k);
      break;
    case 'tap':
      pull(B.lHand, n.x + 14, n.y + 30, k); pull(B.rHand, n.x - 14, n.y + 30, k);
      pull(B.lFoot, B.lFoot.x, fy - 11 - Math.max(0, Math.sin(t * 0.25)) * 14, 0.15 * e);
      break;
    case 'look':
      pull(B.head, pv.x + Math.sin(t * 0.04) * 8, pv.y - 104, 0.06 * e);
      break;
    case 'watch':
      pull(B.lElbow, n.x - 22, n.y + 25, k); pull(B.lHand, n.x + 6, n.y + 20, k);
      pull(B.head, pv.x - 6, pv.y - 102, 0.06 * e);
      break;
  }
}

// Puppet-string force that makes the dummy wobble back onto its feet.
function pull(p, tx, ty, k) {
  let dx = (tx - p.x) * k, dy = (ty - p.y) * k;
  const m = Math.hypot(dx, dy), MAX = 3;
  if (m > MAX) { dx *= MAX / m; dy *= MAX / m; }
  p.x += dx; p.y += dy;
  p.px += (p.x - p.px) * 0.12;
}

// ---------- Game state ----------
const TOOLS = [
  { id: 'grab', icon: '✋', name: 'Grab', price: 0, key: '1' },
  { id: 'punch', icon: '👊', name: 'Punch', price: 0, key: '2' },
  { id: 'chicken', icon: '🐔', name: 'Chicken', price: 0, key: '3' },
  { id: 'fish', icon: '🐟', name: 'Fish', price: 40, key: '4' },
  { id: 'tomato', icon: '🍅', name: 'Tomato', price: 75, key: '5' },
  { id: 'bat', icon: '🏏', name: 'Bat', price: 100, key: '6' },
  { id: 'hammer', icon: '🔨', name: 'Hammer', price: 150, key: '7' },
  { id: 'bomb', icon: '💣', name: 'Bomb', price: 250, key: '8' },
  { id: 'zap', icon: '⚡', name: 'Zap', price: 350, key: '9' },
  { id: 'piano', icon: '🎹', name: 'Piano', price: 500, key: '0' },
  { id: 'couch', icon: '🛋️', name: 'Couch', price: 600, key: 'c' },
  { id: 'rocket', icon: '🚀', name: 'Rocket', price: 750, key: '-' },
  { id: 'vikings', icon: '⚔️', name: 'Vikings', price: 900, key: 'v', earthOnly: true },
  { id: 'meteor', icon: '☄️', name: 'Meteor', price: 1200, key: '=' },
];
let tool = 'punch';
let drag = null;
let pain = 0, hurtT = 0, bodyFlash = 0, shake = 0, flash = 0, swingT = 0, standK = 0;
let combo = 0, lastHit = 0, lastIdle = performance.now(), sessionDmg = 0, wasDizzy = false;
let speech = null;
let zapT = 0, zapTarget = null;
let idling = false, blinkT = 0;
const idle = { action: 'breathe', t: 0, dur: 200 };
const particles = [], texts = [], bombs = [], pianos = [], projectiles = [], couches = [], vikings = [];
const pointer = { x: 0, y: 0, lastX: 0, lastY: 0, vx: 0, vy: 0, inside: false };

const LINES = {
  hit: ['Ow!', 'Not the face!', 'Hey!', 'Rude!', 'My spleen!', 'I felt that!', 'Ouchie!',
        'Was that necessary?', "I'm telling HR!", 'Mommy!', 'Ugh!', 'Why me?'],
  big: ['AAAAARGH!', 'WHY?!', 'MY WARRANTY!', 'I SEE MY ANCESTORS', 'OKAY THAT ONE HURT'],
  chicken: ['...a chicken?', 'Bawk?!', 'This is humiliating.', 'Is that... rubber?'],
  grab: ['Put me down!', 'Wheee!', 'Not again!', 'Careful, I bruise easily!'],
  idle: ["Is that all you've got?", "I'm bored...", 'Hellooo?', "Bet you can't hit me!",
         '*whistles*', 'Did you forget about me?', 'I could do this all day.'],
  wave: ['Hi there!', 'Hellooo!', 'Yoo-hoo!'],
  watch: ['Any time now...', 'Tick tock...', 'I have a meeting at three.'],
  stretch: ['*yaaawn*', 'Ahh, that\'s the spot.'],
  dizzy: ['I see stars...', 'Wh-where am I?', 'Is it Tuesday?', 'Mama, the birds...'],
  heal: ['Good as new!', 'Ready for round two!', 'I feel fantastic!'],
  fish: ['Did you just slap me with a FISH?', 'Smells like low tide.', 'Something smells fishy!'],
  tomato: ['I\'m a dummy, not a salad!', 'Now I need a shower.', 'Is this ketchup?!'],
  zap: ['I can see my bones!', 'Shocking!', 'My circuits!', 'That tickles... A LOT!'],
  hammer: ['My head is not a nail!', 'Stop hammering me!', 'I\'m shorter now.'],
  furniture: ['Put that back!', 'Watch the furniture!', 'Who decorates like this?!', 'That was an heirloom!'],
  couch: ['Not the furniture!', 'I just wanted to sit down!', 'Who throws a COUCH?!', 'Comfy... but OW!'],
  vikings: ['VIKINGS?!', 'I come in peace!', 'Not the pillaging!', 'Is it Ragnarök already?!', 'Valhalla can wait!'],
  airlock: ['NOT THE AIRLOCK!', 'Hold the door!', "I'm too young to be space junk!", 'Who pressed the big red button?!'],
  space: ['Houston, I have a problem.', 'In space, no one can hear me scream.', 'Which way is up?!',
          'I think I left my stomach on Earth.', 'One small smack for man...', 'Wheee... slowly.'],
};
function say(lines, force = false) {
  if (!force && speech && speech.t < 70) return;
  speech = { text: pick(lines), t: 0 };
}

const WORDS = { punch: ['POW!', 'BAM!', 'WHAM!', 'SMACK!'], bat: ['WHACK!', 'BONK!', 'CRACK!'],
  chicken: ['SQUEAK!', 'BAWK!'], impact: ['THUD!', 'SPLAT!', 'CRUNCH!'], bomb: ['KA-BOOM!'], piano: ['CRASH!'],
  fish: ['SLAP!', 'SPLOSH!'], tomato: ['SPLAT!'], hammer: ['CLANG!', 'BONK!', 'THWACK!'], zap: ['BZZZT!', 'ZAP!'],
  rocket: ['KA-BOOM!'], meteor: ['KRAKOOM!'], vikings: ['CHOP!', 'HACK!', 'SKÅL!', 'RAAAH!'], couch: ['WHUMP!', 'CRASH!', 'SOFA SLAM!'],
  furniture: ['CRASH!', 'WHAM!', 'KER-SMASH!'] };
const WORD_COLORS = ['#ff3b3b', '#ffd23f', '#3bd1ff', '#ff7bd5', '#7dff6b'];

function addText(x, y, text, color, size, rot = 0) {
  texts.push({ x, y, text, color, size, rot, life: 0, max: 50 });
}
function burst(x, y, n, type, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (o.speed || 5) * rand(0.3, 1.3);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 0),
      life: 0, max: (o.life || 40) * rand(0.6, 1.2), type,
      size: (o.size || 6) * rand(0.6, 1.4), rot: Math.random() * 6, vr: rand(-0.15, 0.15),
      color: o.color || pick(['#222', '#eee', '#8b4513']),
    });
  }
}

function damage(p, amount, kind = 'impact') {
  amount = Math.max(1, Math.round(amount));
  const now = performance.now();
  combo = now - lastHit < 1300 ? combo + 1 : 1;
  lastHit = now;
  let earned = Math.max(1, Math.round(amount * 0.5 * (1 + Math.min(combo, 20) * 0.1)));
  // A free airlock blast only pays out so much, or furniture crushing the dummy would print coins
  if (airlock.t >= 0) { earned = Math.min(earned, AIRLOCK.maxCoins - airlock.earned); airlock.earned += earned; }
  save.coins += earned; save.total += amount; sessionDmg += amount;
  persist(); updateHud();

  pain += amount; hurtT = 35; bodyFlash = 1;
  shake = Math.min(30, shake + amount * 0.5);
  if (earned > 0) addText(p.x + rand(-10, 10), p.y - p.r - 10, '+' + earned + ' 🪙', '#ffd23f', 18);
  if (amount >= 6) burst(p.x, p.y, Math.min(12, 2 + amount / 4), 'star', { speed: 6, life: 35, size: 7 });
  if (amount >= 10 && Math.random() < 0.7) {
    addText(p.x + rand(-40, 40), p.y - 50, pick(WORDS[kind] || WORDS.impact), pick(WORD_COLORS), 38 + Math.min(amount, 40) * 0.5, rand(-0.3, 0.3));
  }
  if (kind === 'chicken') say(LINES.chicken);
  else if (LINES[kind] && Math.random() < 0.5) say(LINES[kind]);
  else if (amount >= 30) say(LINES.big, true);
  else if (Math.random() < 0.35) say(LINES.hit);
}

// ---------- Tools ----------
function nearestPoint(x, y) {
  let best = null, bd = Infinity;
  for (const p of points) {
    const d = Math.hypot(p.x - x, p.y - y) - p.r;
    if (d < bd) { bd = d; best = p; }
  }
  return { p: best, d: bd };
}

function strike(reach, force, dmg, kind, dir = null) {
  const { p, d } = nearestPoint(pointer.x, pointer.y);
  if (!p || d > reach) { sfx.swoosh(); return; }
  let dx, dy, m;
  if (dir) {
    [dx, dy] = dir;
  } else {
    const cx = (B.neck.x + B.pelvis.x) / 2, cy = (B.neck.y + B.pelvis.y) / 2;
    dx = (p.x - pointer.x) + (cx - pointer.x) * 0.5 + pointer.vx * 2;
    dy = (p.y - pointer.y) + (cy - pointer.y) * 0.5 + pointer.vy * 2;
    m = Math.hypot(dx, dy);
    if (m < 4) { dx = Math.random() < 0.5 ? -1 : 1; dy = 0; m = 1; }
    dx /= m; dy = dy / m - 0.35;
  }
  m = Math.hypot(dx, dy); dx /= m; dy /= m;

  for (const q of points) { q.px -= dx * force * 0.3; q.py -= dy * force * 0.3; }
  p.px -= dx * force; p.py -= dy * force;

  const mult = p === B.head ? 1.5 : 1;
  damage(p, dmg * mult * rand(0.8, 1.2), kind);
  if (kind === 'chicken') {
    sfx.squeak();
    burst(p.x, p.y, 8, 'feather', { speed: 4, life: 70, size: 6 });
  } else if (kind === 'fish') {
    sfx.slap();
    burst(p.x, p.y, 12, 'drop', { speed: 5, life: 40, size: 3, up: 2, color: '#7fd4ff' });
  } else if (kind === 'hammer') {
    sfx.clang();
  } else {
    sfx.hit(kind === 'bat' ? 1 : 0.6);
    if (kind === 'bat') sfx.bonk();
  }
}

function launch(type, sx, sy, vx, vy, g, r, extra = {}) {
  projectiles.push({ type, x: sx, y: sy, vx, vy, g, r, age: 0, rot: 0, ...extra });
}

function zap() {
  const { p, d } = nearestPoint(pointer.x, pointer.y);
  sfx.zap();
  if (p && d < 60) {
    zapT = 50; zapTarget = p;
  } else {
    zapT = 12; zapTarget = { x: pointer.x, y: floorY(), r: 0, fake: true };
  }
}

function useTool() {
  swingT = 1;
  switch (tool) {
    case 'grab': {
      const { p, d } = nearestPoint(pointer.x, pointer.y);
      if (p && d < 30) {
        drag = p;
        canvas.style.cursor = 'grabbing';
        if (Math.random() < 0.5) say(LINES.grab);
      } else {
        const pr = [...props].reverse().find(o => inProp(o, pointer.x, pointer.y, 6));
        if (pr) {
          heldProp = pr; pr.gx = pr.x - pointer.x; pr.gy = pr.y - pointer.y;
          canvas.style.cursor = 'grabbing';
        }
      }
      break;
    }
    case 'punch': strike(30, 16, 7, 'punch'); break;
    case 'bat': strike(50, 32, 16, 'bat'); break;
    case 'chicken': strike(40, 9, 3, 'chicken'); break;
    case 'fish': strike(40, 14, 5, 'fish'); break;
    case 'hammer': strike(50, 30, 20, 'hammer', [rand(-0.2, 0.2), 1]); break;
    case 'zap': zap(); break;
    case 'tomato': {
      // Lobbed from the nearest side of the room toward the click
      const sx = pointer.x < W / 2 ? -20 : W + 20, sy = floorY() - 160, g = 0.4 * phys().g;
      const T = Math.max(20, Math.hypot(pointer.x - sx, pointer.y - sy) / 18);
      launch('tomato', sx, sy, (pointer.x - sx) / T, (pointer.y - sy) / T - 0.5 * g * T, g, 10);
      sfx.swoosh();
      break;
    }
    case 'couch': {
      // Heaved in from the nearest side, tumbling end over end
      const sx = pointer.x < W / 2 ? -90 : W + 90, sy = floorY() - 260, g = 0.5 * phys().g;
      const T = Math.max(25, Math.hypot(pointer.x - sx, pointer.y - sy) / 16);
      const vx = (pointer.x - sx) / T;
      couches.push({ x: sx, y: sy, vx, vy: (pointer.y - sy) / T - 0.5 * g * T, g,
        rot: 0, vr: Math.sign(vx) * 0.09, hit: false, landed: 0, alpha: 1, age: 0 });
      sfx.swoosh();
      break;
    }
    case 'rocket': {
      // Fired from the far side of the room at the click height
      const fromLeft = pointer.x > W / 2;
      launch('rocket', fromLeft ? -40 : W + 40, pointer.y, fromLeft ? 20 : -20, 0, 0, 10);
      sfx.rocket();
      break;
    }
    case 'meteor': {
      const tx = pointer.x, ty = floorY(), sx = tx + (tx < W / 2 ? 350 : -350), sy = -120;
      const m = Math.hypot(tx - sx, ty - sy);
      launch('meteor', sx, sy, (tx - sx) / m * 16, (ty - sy) / m * 16, 0, 26, { tx });
      sfx.meteor();
      break;
    }
    case 'vikings': {
      // A horde charges in from the edge nearest the click and runs across the floor
      const dir = pointer.x < W / 2 ? 1 : -1, x0 = dir > 0 ? -60 : W + 60;
      const n = Math.max(0, Math.min(8, 30 - vikings.length));
      for (let i = 0, x = x0; i < n; i++, x -= dir * rand(45, 65)) {
        vikings.push({ x, dir, speed: rand(5, 6.5), phase: rand(0, 6), depth: rand(-6, 10), scale: rand(0.85, 1.05),
          weapon: pick(['axe', 'sword', 'spear']), tunic: pick(['#8b3a2e', '#3b5f8a', '#4f7a3a', '#7a5a2e']),
          beard: pick(['#d9772b', '#e8c766', '#6b3f1f', '#b23a1a']), shield: pick(['#c0392b', '#2e6fb5', '#d4a017']),
          swing: 0, hit: false });
      }
      if (n) { sfx.warcry(); say(LINES.vikings, true); }
      break;
    }
    case 'bomb':
      bombs.push({ x: pointer.x, y: Math.min(pointer.y, floorY() - 14), vx: pointer.vx * 0.5,
        vy: zeroG() ? pointer.vy * 0.5 : 0, fuse: 100 });
      sfx.tick();
      break;
    case 'piano':
      // Without gravity to speed it up, the piano gets a harder shove
      pianos.push({ x: pointer.x, y: -120, vy: zeroG() ? 10 : 2, w: 150, h: 100, hit: false, landed: 0, alpha: 1 });
      sfx.swoosh();
      break;
  }
}

function explode(b, R = 280, F = 42, kind = 'bomb') {
  let maxF = 0, closest = B.pelvis;
  for (const p of points) {
    const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy) || 1;
    if (d < R) {
      const f = (1 - d / R) * F;
      p.px -= dx / d * f;
      p.py -= dy / d * f - f * 0.3;
      if (f > maxF) { maxF = f; closest = p; }
    }
  }
  if (maxF > 0) damage(closest, maxF * 1.6, kind);
  for (const p of props) {
    const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy) || 1;
    if (d < R && p !== heldProp) {
      const f = (1 - d / R) * F * 0.6 / p.mass;
      p.vx += dx / d * f; p.vy += dy / d * f - f * 0.5; p.va += rand(-0.15, 0.15);
    }
  }
  for (const o of bombs) if (o !== b && Math.hypot(o.x - b.x, o.y - b.y) < R) o.fuse = Math.min(o.fuse, 6);
  const scale = R / 280;
  burst(b.x, b.y, 40 * scale, 'fire', { speed: 9 * scale, life: 30, size: 14 * scale });
  burst(b.x, b.y, 18 * scale, 'smoke', { speed: 3 * scale, life: 70, size: 16 * scale, up: 1 });
  burst(b.x, b.y, 14 * scale, 'debris', { speed: 12 * scale, life: 60, size: 5, up: 4 });
  addText(b.x, b.y - 60, kind === 'meteor' ? 'KRAKOOM!' : 'KA-BOOM!', '#ff7b00', 56 * Math.sqrt(scale), rand(-0.2, 0.2));
  shake = 35 * scale; flash = Math.min(1, 0.8 * scale);
  sfx.boom();
}

function projectileHit(pr, p) {
  switch (pr.type) {
    case 'tomato':
      if (p) {
        p.px -= pr.vx * 0.5; p.py -= pr.vy * 0.5;
        damage(p, 4, 'tomato');
      }
      burst(pr.x, pr.y, 16, 'drop', { speed: 5, life: 45, size: 4, up: 2, color: '#e8322a' });
      sfx.splat();
      break;
    case 'rocket': explode(pr, 260, 45, 'rocket'); break;
    case 'meteor': explode(pr, 420, 60, 'meteor'); break;
  }
}

// ---------- Viking horde ----------
// Each viking runs along the floor and chops the first body part that comes within reach of its weapon, once.
let vikingStomp = 0;
function stepVikings(fy) {
  for (let i = vikings.length - 1; i >= 0; i--) {
    const v = vikings[i];
    v.x += v.dir * v.speed; v.phase += v.speed * 0.06;
    v.swing *= 0.85;

    if (!v.hit) {
      const reachX = v.x + v.dir * 30;
      let target = null, bd = 40;
      for (const p of points) {
        const d = Math.abs(p.x - reachX);
        if (d < bd && p.y > fy - 150) { bd = d; target = p; }
      }
      if (target) {
        v.hit = true; v.swing = 1;
        for (const p of points) p.px -= v.dir * 2;
        target.px -= v.dir * 12; target.py += 8;
        damage(target, rand(6, 9), 'vikings');
        if (v.weapon === 'sword') sfx.clang(); else { sfx.slap(); sfx.hit(0.7); }
        burst(target.x, target.y, 5, 'star', { speed: 5, life: 30, size: 6 });
      }
    }
    if ((v.dir > 0 && v.x > W + 80) || (v.dir < 0 && v.x < -80)) vikings.splice(i, 1);
  }
  if (vikings.length && ++vikingStomp % 9 === 0) sfx.stomp();
}

// ---------- Airlock (zero-g rooms only) ----------
// Alarm for `warn` frames, then the hatch on the left wall opens for `open` frames and sucks everything toward it.
// After closing it needs `recharge` frames before it can be opened again.
const AIRLOCK = { warn: 60, open: 200, h: 200, recharge: 600, maxCoins: 150 };
const airlock = { t: -1, earned: 0, cooldown: 0 };
const hatchY = () => floorY() - 140;

function airlockOpenness() {
  const t = airlock.t - AIRLOCK.warn;
  if (airlock.t < 0 || t < 0) return 0;
  return Math.max(0, Math.min(1, t / 15, (AIRLOCK.open - t) / 20));
}

function openAirlock() {
  if (!zeroG() || airlock.t >= 0 || airlock.cooldown > 0) return;
  airlock.t = 0; airlock.earned = 0;
  say(LINES.airlock, true);
  updateAirlockBtn();
}

function stepAirlock() {
  if (airlock.cooldown > 0 && --airlock.cooldown % 60 === 0) updateAirlockBtn();
  if (airlock.t < 0) return;
  const t = airlock.t++;
  if (t % 20 === 0) sfx.alarm();
  if (t === AIRLOCK.warn) { sfx.thud(); sfx.whoosh(); }
  if (airlock.t >= AIRLOCK.warn + AIRLOCK.open) {
    airlock.t = -1; airlock.cooldown = AIRLOCK.recharge; sfx.thud(); updateAirlockBtn();
    return;
  }
  const o = airlockOpenness();
  if (!o) return;

  // Suction toward the hatch, a bit stronger up close
  const hy = hatchY(), half = AIRLOCK.h / 2 * o;
  const suck = (x, y, s) => {
    const dx = -x, dy = hy - y, d = Math.hypot(dx, dy) || 1;
    const f = s * o * (0.6 + 0.4 * Math.max(0, 1 - d / W));
    return [dx / d * f, dy / d * f];
  };
  // Small things that reach the opening are lost to space
  const gone = (x, y, r = 0) => x < 30 + r && Math.abs(y - hy) < half;

  for (const p of points) {
    if (p === drag) continue;
    const [ax, ay] = suck(p.x, p.y, 1.3);
    p.x += ax; p.y += ay;
  }
  for (const p of props) {
    if (p === heldProp) continue;
    const [ax, ay] = suck(p.x, p.y, 0.9);
    p.vx += ax / p.mass; p.vy += ay / p.mass;
  }
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i], [ax, ay] = suck(b.x, b.y, 1);
    b.vx += ax; b.vy += ay;
    if (gone(b.x, b.y)) bombs.splice(i, 1);
  }
  for (let i = couches.length - 1; i >= 0; i--) {
    const c = couches[i], [ax, ay] = suck(c.x, c.y, 0.8);
    c.vx += ax; c.vy += ay;
    if (gone(c.x, c.y, 70)) couches.splice(i, 1);
  }
  for (const pr of projectiles) {
    const [ax, ay] = suck(pr.x, pr.y, 0.6);
    pr.vx += ax; pr.vy += ay;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i], [ax, ay] = suck(p.x, p.y, 0.8);
    p.vx += ax; p.vy += ay;
    if (gone(p.x, p.y)) particles.splice(i, 1);
  }

  // Air rushing out
  for (let i = 0; i < 3; i++) {
    particles.push({ x: rand(W * 0.15, W), y: rand(20, floorY()), vx: -2, vy: 0, life: 0, max: 80,
      type: 'wind', size: 1, rot: 0, vr: 0, color: '#fff' });
  }
  shake = Math.max(shake, 4 * o);
}

const airlockBtn = document.getElementById('airlockBtn');
function updateAirlockBtn() {
  airlockBtn.style.display = zeroG() ? '' : 'none';
  airlockBtn.disabled = airlock.t >= 0 || airlock.cooldown > 0;
  // Show the seconds left while recharging
  airlockBtn.textContent = airlock.cooldown > 0 ? Math.ceil(airlock.cooldown / 60) : '🚪';
}
airlockBtn.onclick = () => { ac(); openAirlock(); };

// ---------- Simulation step ----------
function step() {
  const now = performance.now();
  const fy = floorY(), { g: G, damp } = phys();

  pointer.vx += ((pointer.x - pointer.lastX) - pointer.vx) * 0.5;
  pointer.vy += ((pointer.y - pointer.lastY) - pointer.vy) * 0.5;
  pointer.lastX = pointer.x; pointer.lastY = pointer.y;

  // Get back up when not too beaten up
  const dizzy = pain > 70;
  const canStand = !drag && !dizzy && pain < 35 && now - lastHit > 1500;
  standK = canStand ? Math.min(1, standK + 0.02) : 0;
  if (standK > 0 && G) {
    const footOnFloor = B.lFoot.y > fy - B.lFoot.r - 3 || B.rFoot.y > fy - B.rFoot.r - 3;
    if (footOnFloor) {
      const fx = (B.lFoot.x + B.rFoot.x) / 2, fyy = Math.max(B.lFoot.y, B.rFoot.y);
      pull(B.pelvis, fx, fyy - 70, 0.12 * standK);
      pull(B.neck, B.pelvis.x, B.pelvis.y - 65, 0.08 * standK);
      pull(B.head, B.pelvis.x, B.pelvis.y - 105, 0.12 * standK);
    }
  }

  idling = standK >= 1 && !drag && !heldProp && zapT <= 0 && airlock.t < 0 && now - lastHit > 3000;
  if (idling) stepIdle(fy);
  else { idle.action = 'breathe'; idle.t = 0; idle.dur = 120; }
  if (blinkT > 0) blinkT--; else if (Math.random() < 0.006) blinkT = 7;

  // Integrate
  for (const p of points) {
    if (p.cd > 0) p.cd--;
    if (p === drag) {
      p.px = p.x; p.py = p.y;
      p.x = pointer.x; p.y = pointer.y;
      collideBounds(p, false);
      continue;
    }
    let vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
    const sp = Math.hypot(vx, vy);
    if (sp > MAXV) { vx *= MAXV / sp; vy *= MAXV / sp; }
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + GRAVITY * G;
  }

  stepAirlock();

  // Wall impacts hurt
  for (const p of points) {
    if (p === drag) continue;
    const imp = collideBounds(p, true);
    if (imp > 9 && p.cd === 0) {
      p.cd = 12;
      const mult = p === B.head ? 1.5 : 1;
      damage(p, (imp - 7) * 1.3 * mult, 'impact');
      sfx.hit(imp / 30);
      burst(p.x, Math.min(p.y + p.r, fy), 4, 'smoke', { speed: 2, life: 30, size: 8 });
    }
  }

  for (let i = 0; i < ITER; i++) {
    for (const s of sticks) solveStick(s);
    for (const p of points) collideBounds(p, false);
  }

  // Bombs
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.vy += 0.6 * G; b.x += b.vx; b.y += b.vy;
    if (b.y > fy - 14) { b.y = fy - 14; b.vy *= -0.3; b.vx *= 0.85; }
    if (b.y < 14) { b.y = 14; b.vy = Math.abs(b.vy) * 0.5; }
    if (b.x < 14 || b.x > W - 14) { b.x = Math.max(14, Math.min(W - 14, b.x)); b.vx *= -0.5; }
    b.fuse--;
    if (b.fuse % 15 === 0) sfx.tick();
    if (b.fuse <= 0) { bombs.splice(i, 1); explode(b); }
  }

  // Pianos
  for (let i = pianos.length - 1; i >= 0; i--) {
    const pn = pianos[i];
    if (!pn.landed) { pn.vy += 0.8 * G; pn.y += pn.vy; }
    if (!pn.hit) {
      const touching = points.some(p =>
        p.x > pn.x - pn.w / 2 - p.r && p.x < pn.x + pn.w / 2 + p.r &&
        p.y > pn.y - pn.h / 2 - p.r && p.y < pn.y + pn.h / 2 + p.r);
      if (touching) {
        pn.hit = true;
        for (const p of points) {
          if (Math.abs(p.x - pn.x) < pn.w / 2 + 40 && p.y > pn.y - pn.h / 2 - 40) {
            const side = Math.sign(p.x - pn.x) || (Math.random() < 0.5 ? -1 : 1);
            p.px -= side * 14; p.py -= 22;
          }
        }
        damage(B.head, rand(50, 65), 'piano');
        sfx.piano(); shake = 30;
      }
    }
    if (!pn.landed && pn.y + pn.h / 2 >= fy) {
      pn.y = fy - pn.h / 2; pn.landed = 1;
      sfx.piano(); shake = Math.max(shake, 15);
      burst(pn.x, fy - 10, 20, 'debris', { speed: 10, life: 60, size: 6, up: 5 });
      burst(pn.x, fy - 10, 10, 'smoke', { speed: 3, life: 60, size: 14 });
    }
    if (pn.landed) {
      pn.landed++;
      if (pn.landed > 60) pn.alpha -= 0.03;
      if (pn.alpha <= 0) pianos.splice(i, 1);
    }
  }

  stepProps(fy);
  stepVikings(fy);

  // Couches
  for (let i = couches.length - 1; i >= 0; i--) {
    const c = couches[i];
    c.age++;
    c.vy += c.g; c.x += c.vx; c.y += c.vy; c.rot += c.vr;
    if (!c.hit) {
      const inBox = p => Math.abs(p.x - c.x) < 75 + p.r && Math.abs(p.y - c.y) < 35 + p.r;
      if (points.some(inBox)) {
        c.hit = true;
        let closest = B.pelvis, bd = Infinity;
        for (const p of points) {
          const d = Math.hypot(p.x - c.x, p.y - c.y);
          if (d < bd) { bd = d; closest = p; }
          if (d < 160) { p.px -= c.vx * 0.9; p.py -= c.vy * 0.6 - 5; }
        }
        damage(closest, rand(30, 40), 'couch');
        sfx.thud(); sfx.hit(1);
        burst(closest.x, closest.y, 10, 'debris', { speed: 7, life: 40, size: 4, color: '#c9a2e8' });
        c.vx *= 0.5; c.vy *= 0.5;
      }
    }
    if (c.age > 20) {
      if (c.x < 80) { c.x = 80; c.vx = Math.abs(c.vx) * 0.3; }
      if (c.x > W - 80) { c.x = W - 80; c.vx = -Math.abs(c.vx) * 0.3; }
      if (c.y < 40) { c.y = 40; c.vy = Math.abs(c.vy) * 0.3; }
    }
    if (c.y + 25 > fy) {
      c.y = fy - 25;
      if (!c.landed) {
        c.landed = 1;
        sfx.thud(); shake = Math.max(shake, 18);
        burst(c.x, fy - 5, 12, 'smoke', { speed: 3, life: 50, size: 12 });
      }
      c.vy *= -0.25; c.vx *= 0.85; c.vr = 0;
      c.rot = Math.atan2(Math.sin(c.rot), Math.cos(c.rot)) * 0.8;
    }
    // A couch drifting in zero-g may never land, so fade it out after a while regardless
    if (c.landed) c.landed++;
    if (c.landed > 120 || c.age > 300) c.alpha -= 0.03;
    if (c.alpha <= 0) couches.splice(i, 1);
  }

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.vy += pr.g; pr.x += pr.vx; pr.y += pr.vy; pr.age++; pr.rot += 0.2;
    if (pr.type === 'rocket') {
      burst(pr.x - Math.sign(pr.vx) * 18, pr.y, 1, 'fire', { speed: 1, life: 15, size: 7 });
      if (pr.age % 3 === 0) burst(pr.x - Math.sign(pr.vx) * 22, pr.y, 1, 'smoke', { speed: 0.5, life: 40, size: 6 });
    } else if (pr.type === 'meteor') {
      burst(pr.x, pr.y, 2, 'fire', { speed: 1.5, life: 25, size: 14 });
      burst(pr.x, pr.y, 1, 'smoke', { speed: 0.5, life: 50, size: 12 });
    }
    const body = points.find(p => Math.hypot(p.x - pr.x, p.y - pr.y) < p.r + pr.r);
    const offscreen = pr.type !== 'meteor' && pr.age > 10 && (pr.x < -60 || pr.x > W + 60);
    const hitWorld = pr.y > fy - pr.r || offscreen || pr.age > 400 ||
      (pr.type !== 'meteor' && pr.age > 10 && (pr.x < pr.r || pr.x > W - pr.r));
    if (body || hitWorld) {
      projectiles.splice(i, 1);
      if (!offscreen) projectileHit(pr, body);
    }
  }

  // Electrocution: twitch the whole body and tick damage
  if (zapT > 0) {
    zapT--;
    if (!zapTarget.fake) {
      for (const p of points) { p.px += rand(-3, 3); p.py += rand(-3, 3); }
      if (zapT % 8 === 0) damage(zapTarget, 4, 'zap');
      burst(zapTarget.x, zapTarget.y, 2, 'drop', { speed: 6, life: 15, size: 2, color: '#bfe9ff' });
    } else if (zapT === 11) {
      burst(zapTarget.x, zapTarget.y, 12, 'drop', { speed: 6, life: 20, size: 2, color: '#bfe9ff' });
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life++; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    switch (p.type) {
      case 'star': p.vy += 0.25 * G; p.vx *= 0.97; break;
      case 'feather': p.vy = p.vy * 0.9 + 0.08 * G; p.vx *= 0.95; p.x += Math.sin(p.life * 0.2) * 0.8 * G; break;
      case 'smoke': p.vx *= 0.95; p.vy = p.vy * 0.95 - 0.05 * G; p.size += 0.4; break;
      case 'fire': p.vx *= 0.9; p.vy = p.vy * 0.9 - 0.1 * G; break;
      case 'debris':
        p.vy += 0.5 * G;
        if (p.y > fy) { p.y = fy; p.vy *= -0.4; p.vx *= 0.7; }
        break;
      case 'drop':
        p.vy += 0.35 * G;
        if (p.y > fy) { p.y = fy; p.vy = 0; p.vx *= 0.5; }
        break;
    }
    if (p.life >= p.max) particles.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life++; t.y -= 1.2;
    if (t.life >= t.max) texts.splice(i, 1);
  }

  // Timers
  pain = Math.max(0, pain * 0.996 - 0.25);
  if (hurtT > 0) hurtT--;
  bodyFlash *= 0.85; flash *= 0.88; swingT *= 0.8;
  shake = shake < 0.3 ? 0 : shake * 0.85;
  if (speech && ++speech.t > 120) speech = null;

  const isDizzy = pain > 70;
  if (isDizzy && !wasDizzy) say(LINES.dizzy, true);
  wasDizzy = isDizzy;

  if (now - lastHit > 7000 && now - lastIdle > 7000) { lastIdle = now; say(zeroG() ? LINES.space : LINES.idle); }
}

// ---------- Rendering ----------
const OUT = '#1d1d1d';
const YEL = [245, 196, 0], YEL_D = [205, 158, 0], RED = [255, 80, 60];
const mix = (a, b, t) => `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function star(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
// Crash-test-dummy target marker
function marker(x, y, r) {
  circle(x, y, r); ctx.fillStyle = '#ffe14d'; ctx.fill();
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, 0, Math.PI / 2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, Math.PI, Math.PI * 1.5); ctx.closePath(); ctx.fill();
  circle(x, y, r); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
}

// ---------- Rooms ----------
const ROOMS = [
  { id: 'living', name: 'Living Room', wall: ['#c9a37a', '#e3c7a0'], pattern: 'stripes',
    floor: ['#8a5a3b', '#4e3020'], floorPattern: 'planks', decor: decorLiving, floorDecor: rugLiving },
  { id: 'office', name: 'Office', wall: ['#34405e', '#55668e'], pattern: 'stripes',
    floor: ['#626a78', '#3c414a'], floorPattern: 'carpet', decor: decorOffice },
  { id: 'kitchen', name: 'Kitchen', wall: ['#bfe3dc', '#dcf2ed'], pattern: 'tiles',
    floor: ['#eeeeee', '#cfcfcf'], floorPattern: 'checker', decor: decorKitchen },
  { id: 'garage', name: 'Garage', wall: ['#7d7d7d', '#9c9c9c'], pattern: 'bricks',
    floor: ['#8c8c8c', '#5c5c5c'], floorPattern: 'concrete', decor: decorGarage, floorDecor: garageFloor },
  { id: 'bedroom', name: 'Bedroom', wall: ['#8d7bb8', '#b3a3d9'], pattern: 'dots',
    floor: ['#d9a5b5', '#a8778a'], floorPattern: 'carpet', decor: decorBedroom, floorDecor: rugBedroom },
  { id: 'space', name: 'Space Station', zeroG: true, wall: ['#04051a', '#1b1550'], pattern: 'starfield',
    floor: ['#565d75', '#2b2f40'], floorPattern: 'grating', decor: decorSpace, floorDecor: spaceFloor },
];
let roomId = ROOMS.some(r => r.id === save.room) ? save.room : 'living';
const currentRoom = () => ROOMS.find(r => r.id === roomId);

function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function box(x, y, w, h, fill, stroke = 'rgba(0,0,0,0.45)', lw = 3) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); }
}

function drawRoom() {
  const fy = floorY(), room = currentRoom();
  const g = ctx.createLinearGradient(0, 0, 0, fy);
  g.addColorStop(0, room.wall[0]); g.addColorStop(1, room.wall[1]);
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, fy + 60);
  drawWallPattern(room.pattern, fy);

  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-60, fy - 16, W + 120, 16);
  const g2 = ctx.createLinearGradient(0, fy, 0, H);
  g2.addColorStop(0, room.floor[0]); g2.addColorStop(1, room.floor[1]);
  ctx.fillStyle = g2; ctx.fillRect(-60, fy, W + 120, H - fy + 60);
  drawFloorPattern(room.floorPattern, fy);
  if (room.floorDecor) room.floorDecor(fy);
  room.decor(fy);
}

function drawWallPattern(type, fy) {
  ctx.save();
  if (type === 'stripes') {
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let x = 0; x < W; x += 64) ctx.fillRect(x, -60, 32, fy + 60);
  } else if (type === 'tiles') {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
    for (let x = 0; x < W + 40; x += 40) seg(x, -60, x, fy);
    for (let y = fy; y > -60; y -= 40) seg(-60, y, W + 60, y);
  } else if (type === 'bricks') {
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    for (let row = 0, y = fy; y > -60; row++, y -= 26) {
      seg(-60, y, W + 60, y);
      for (let x = row % 2 ? -30 : -60; x < W + 60; x += 60) seg(x, y, x, y - 26);
    }
  } else if (type === 'dots') {
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    for (let y = 30, row = 0; y < fy; y += 50, row++)
      for (let x = row % 2 ? 25 : 0; x < W + 50; x += 50) { star(x, y, 5, 0); ctx.fill(); }
  } else if (type === 'starfield') {
    // Fixed pseudo-random stars that twinkle
    const t = performance.now() / 700;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 140; i++) {
      const x = (i * 7919 % 1000) / 1000 * W, y = (i * 104729 % 997) / 997 * fy;
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t + i * 1.7));
      circle(x, y, i % 7 === 0 ? 2 : 1.1); ctx.fill();
    }
  }
  ctx.restore();
}

function drawFloorPattern(type, fy) {
  ctx.save();
  if (type === 'planks') {
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    for (let y = fy + 24, row = 0; y < H + 60; y += 24, row++) {
      seg(-60, y, W + 60, y);
      for (let x = (row * 97) % 180 - 60; x < W + 60; x += 180) seg(x, y - 24, x, y);
    }
  } else if (type === 'checker') {
    ctx.fillStyle = '#2f2f2f';
    for (let y = fy, row = 0; y < H + 60; y += 30, row++)
      for (let x = -60 + (row % 2) * 30; x < W + 60; x += 60) ctx.fillRect(x, y, 30, 30);
  } else if (type === 'carpet') {
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let y = fy + 6; y < H + 60; y += 12)
      for (let x = (y % 24) - 60; x < W + 60; x += 24) ctx.fillRect(x, y, 6, 3);
  } else if (type === 'concrete') {
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 2;
    for (let x = 0; x < W + 60; x += 240) seg(x, fy, x - 60, H + 60);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W * 0.6, fy + 10); ctx.lineTo(W * 0.63, fy + 30); ctx.lineTo(W * 0.61, fy + 50); ctx.lineTo(W * 0.66, fy + 80); ctx.stroke();
  } else if (type === 'grating') {
    // Riveted deck plates
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2;
    for (let y = fy + 36; y < H + 60; y += 36) seg(-60, y, W + 60, y);
    for (let x = 0; x < W + 60; x += 120) seg(x, fy, x, H + 60);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let y = fy + 6; y < H + 60; y += 36)
      for (let x = 6; x < W + 60; x += 120) { circle(x, y, 2); ctx.fill(); circle(x + 108, y, 2); ctx.fill(); }
  }
  ctx.restore();
}

function windowFrame(x, y, w, h, sky) {
  ctx.fillStyle = sky; ctx.fillRect(x - w / 2, y, w, h);
  ctx.strokeStyle = '#f5f0e6'; ctx.lineWidth = 8; ctx.strokeRect(x - w / 2, y, w, h);
  ctx.lineWidth = 5; seg(x, y, x, y + h); seg(x - w / 2, y + h / 2, x + w / 2, y + h / 2);
}

function decorLiving(fy) {
  // Window with curtains
  const wx = W * 0.16, wy = fy * 0.16, ww = 170, wh = 160;
  const sky = ctx.createLinearGradient(0, wy, 0, wy + wh);
  sky.addColorStop(0, '#6fbfff'); sky.addColorStop(1, '#d8f0ff');
  windowFrame(wx, wy, ww, wh, sky);
  ctx.fillStyle = '#fff';
  for (const [cx, cy, r] of [[-30, 40, 14], [-12, 34, 18], [8, 40, 13]]) { circle(wx + cx, wy + cy, r); ctx.fill(); }
  box(wx - ww / 2 - 34, wy - 18, ww + 68, 7, '#5a3a1e', null);
  ctx.fillStyle = '#b83b3b';
  for (const side of [-1, 1]) {
    const ox = wx + side * (ww / 2 + 30), ix = wx + side * (ww / 2 - 22);
    ctx.beginPath(); ctx.moveTo(ox, wy - 12); ctx.lineTo(ix, wy - 12);
    ctx.quadraticCurveTo(wx + side * (ww / 2 - 2), wy + wh * 0.55, wx + side * (ww / 2 - 12), wy + wh + 24);
    ctx.lineTo(ox, wy + wh + 24); ctx.closePath(); ctx.fill();
  }

  // Painting
  const px = W * 0.5, py = fy * 0.18;
  box(px - 70, py, 140, 92, '#c9a227', '#7a5c10');
  const art = ctx.createLinearGradient(0, py + 8, 0, py + 84);
  art.addColorStop(0, '#ffcf8a'); art.addColorStop(1, '#ff8f6b');
  ctx.fillStyle = art; ctx.fillRect(px - 60, py + 10, 120, 72);
  circle(px + 25, py + 40, 12); ctx.fillStyle = '#fff3b0'; ctx.fill();
  ctx.fillStyle = '#4f8a3a'; ctx.beginPath(); ctx.ellipse(px - 15, py + 82, 70, 28, 0, Math.PI, 0); ctx.fill();
}

function rugLiving(fy) {
  ctx.fillStyle = '#9c2f3f'; ctx.beginPath(); ctx.ellipse(W / 2, fy + 38, 280, 30, 0, 0, Math.PI * 2); ctx.fill();

}

function decorOffice(fy) {
  // Window with blinds
  const wx = W * 0.2, wy = fy * 0.14, ww = 190, wh = 150;
  box(wx - ww / 2, wy, ww, wh, '#cfe8ff', '#e6e6e6', 8);
  ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 6;
  for (let y = wy + 8; y < wy + wh - 4; y += 11) seg(wx - ww / 2 + 4, y, wx + ww / 2 - 4, y);

  // Wall clock showing the real time
  const cx = W * 0.5, cy = fy * 0.17, now = new Date();
  circle(cx, cy, 34); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.stroke();
  const hand = (a, l, w) => { ctx.lineWidth = w; seg(cx, cy, cx + Math.sin(a) * l, cy - Math.cos(a) * l); };
  ctx.lineCap = 'round';
  hand((now.getHours() % 12 + now.getMinutes() / 60) / 12 * Math.PI * 2, 16, 4);
  hand(now.getMinutes() / 60 * Math.PI * 2, 25, 3);
  ctx.strokeStyle = '#c0392b'; hand(now.getSeconds() / 60 * Math.PI * 2, 27, 1.5);

  // Motivational poster

}

function decorKitchen(fy) {

  box(cx0 - 6, fy - 102, W - cx0 + 70, 14, '#5d6670', '#3a4048');

function decorGarage(fy) {
  // Roll-up door
  const dw = Math.min(W * 0.32, 380), dtop = fy - 300;
  box(-60, dtop, dw + 60, fy - dtop, '#d4d4d4', '#888');
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 3;
  for (let y = dtop + 30; y < fy; y += 30) seg(-60, y, dw, y);
  box(dw / 2 - 20, fy - 40, 40, 8, '#666', null);

  // Hanging bulb with light cone
  const bx = W * 0.5;
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; seg(bx, -60, bx, fy * 0.2);
  ctx.fillStyle = 'rgba(255,240,180,0.12)'; ctx.beginPath();
  ctx.moveTo(bx - 10, fy * 0.2); ctx.lineTo(bx + 10, fy * 0.2); ctx.lineTo(bx + 260, fy); ctx.lineTo(bx - 260, fy); ctx.closePath(); ctx.fill();
  circle(bx, fy * 0.2 + 10, 11); ctx.fillStyle = '#fff6c2'; ctx.fill();

  // Pegboard with tools
  const px = W * 0.78, py = fy - 300, pw = 230, ph = 130;

  for (let y = py + 12; y < py + ph; y += 16) for (let x = px - pw / 2 + 12; x < px + pw / 2; x += 16) { circle(x, y, 1.6); ctx.fill(); }
  box(px - 85, py + 30, 8, 70, '#8b5a2b', null); box(px - 97, py + 22, 32, 14, '#555', null);
  ctx.strokeStyle = '#777'; ctx.lineWidth = 8; ctx.lineCap = 'round'; seg(px - 30, py + 30, px - 30, py + 100);
  circle(px - 30, py + 26, 10); ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = '#9aa'; ctx.beginPath(); ctx.moveTo(px + 20, py + 30); ctx.lineTo(px + 90, py + 30); ctx.lineTo(px + 20, py + 60); ctx.closePath(); ctx.fill();
  box(px + 4, py + 26, 18, 30, '#c0392b', null);
}

function garageFloor(fy) {

function decorBedroom(fy) {

  }

function rugBedroom(fy) {

function decorSpace(fy) {
  // Ringed planet
  const px = W * 0.78, py = fy * 0.36, pr = Math.min(W, fy) * 0.17;
  const ring = (start, end) => {
    ctx.beginPath(); ctx.ellipse(px, py, pr * 1.9, pr * 0.42, -0.35, start, end);
    ctx.strokeStyle = 'rgba(240,200,140,0.85)'; ctx.lineWidth = pr * 0.14; ctx.stroke();
  };
  ring(Math.PI, Math.PI * 2);
  const pg = ctx.createRadialGradient(px - pr * 0.4, py - pr * 0.4, pr * 0.1, px, py, pr);
  pg.addColorStop(0, '#ffb36b'); pg.addColorStop(1, '#a8434f');
  circle(px, py, pr); ctx.fillStyle = pg; ctx.fill();
  ctx.save(); circle(px, py, pr); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  for (const dy of [-0.45, 0.05, 0.5]) ctx.fillRect(px - pr, py + dy * pr, pr * 2, pr * 0.16);
  ctx.restore();
  ring(0, Math.PI);

  // Cratered moon
